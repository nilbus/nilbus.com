<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
  </style>
  <script>
    let player = null;
    let isReady = false;
    let pendingLoad = null;
    let progressTimer = null;

    function postMessage(message) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
        window.webkit.messageHandlers.bridge.postMessage(JSON.stringify(message));
      }
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          'playsinline': 1,
          'controls': 1,
          'rel': 0,
          'showinfo': 0,
          'origin': 'https://www.youtube.com',
          'host': 'https://www.youtube.com'
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady() {
      isReady = true;
      postMessage({ type: 'ready' });
      if (pendingLoad) {
        nativeLoadPlaylist(pendingLoad.playlistId, pendingLoad.index, pendingLoad.startSeconds);
        pendingLoad = null;
      }
      startProgressTimer();
    }

    function onPlayerStateChange(event) {
      postMessage({
        type: 'stateChange',
        state: event.data,
        index: player.getPlaylistIndex ? player.getPlaylistIndex() : 0,
        time: player.getCurrentTime ? player.getCurrentTime() : 0
      });
    }

    function onPlayerError(event) {
      const ERROR_MESSAGES = {
        2: 'Invalid parameter passed to the player.',
        4: 'This video format is not supported on this device.',
        5: 'The requested content cannot be played in HTML5.',
        100: 'The video is unavailable or has been removed.',
        101: 'The video owner has disabled embedding.',
        150: 'The video owner has disabled embedding.'
      };

      const message = ERROR_MESSAGES[event.data] || ('YouTube error code ' + event.data);
      postMessage({ type: 'error', code: event.data, message });
    }

    function startProgressTimer() {
      if (progressTimer) {
        clearInterval(progressTimer);
      }
      progressTimer = setInterval(() => {
        if (!player || !isReady || !player.getCurrentTime) {
          return;
        }
        postMessage({
          type: 'progress',
          time: player.getCurrentTime(),
          duration: player.getDuration ? player.getDuration() : 0,
          index: player.getPlaylistIndex ? player.getPlaylistIndex() : 0
        });
      }, 1000);
    }

    function nativeLoadPlaylist(playlistId, index, startSeconds) {
      if (!player || !isReady) {
        pendingLoad = { playlistId, index, startSeconds };
        return;
      }

      const options = {
        listType: 'playlist',
        list: playlistId,
        index: index || 0
      };

      if (typeof startSeconds === 'number') {
        options.startSeconds = startSeconds;
      }

      try {
        player.loadPlaylist(options);
        player.playVideo();
        postMessage({ type: 'playlistLoaded', playlistId });
      } catch (error) {
        postMessage({ type: 'error', message: error.message || 'Failed to load playlist' });
      }
    }

    function nativePlay() {
      if (player && player.playVideo) {
        player.playVideo();
      }
    }

    function nativePause() {
      if (player && player.pauseVideo) {
        player.pauseVideo();
      }
    }

    function nativeSeekTo(time) {
      if (player && player.seekTo) {
        player.seekTo(time, true);
      }
    }

    function nativeSetVolume(value) {
      if (player && player.setVolume) {
        player.setVolume(value);
      }
    }
  </script>
  <script src="https://www.youtube.com/s/player/74dd50f5/player_ias.vflset/en_US/base.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    document.addEventListener('touchstart', function() {}, {passive: true});
  </script>
</head>
<body>
  <div id="player"></div>
</body>
</html>
