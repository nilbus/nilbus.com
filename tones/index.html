<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BrainTones - Get your head in the right space</title>
	<meta name="keywords" content="brainwaves entrainment, alpha, beta, theta, gamma, binaural beats, isochronic tones, nonaural beats, bilateral, white noise, focus, study, relax, anxiety, stress, meditation, sleep, dream, lucid dreaming">
	<meta name="description" content="Use AI-generated Brainwave Entrainement tone layers for various scenarioes, with background music via YouTube playlists">
	<meta name="author" content="Edward Anderson, Dr. Ir. Stephane Pigeon">
	<link href="main.css" rel="stylesheet" type="text/css">
	<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
	<link rel="manifest" href="manifest.json">
	<link rel="mask-icon" href="safari-pinned-tab.svg" color="#c62828">
	<meta name="theme-color" content="#2d0a0a">
	<link rel="image_src" href="socialPreview.jpg">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:site" content="@nilbus">
	<meta name="twitter:title" content="BrainTones - Get your head in the right space">
	<meta name="twitter:description" content="Use AI-generated Brainwave Entrainement tone layers for various scenarioes, with background music via YouTube playlists">
	<meta name="twitter:image:src" content="socialPreview.jpg">
</head>

<body>
<div class="background"></div>
<div class="anchor" id="player"></div>

<main class="tile1">
	<a href="#" class="nounderline">
		<div id="title">
			<img src="ba_logo.png" class="logo" alt="">
			<span class="white">brain</span><span class="accent-red">tones</span>
		</div>
	</a>
	<div id="subtitle"><span class="white">Get your head in the right space</span></div>

	<div class="ctrSection">
		<img src="mute.png" class="ctrlImg" id="mute" title="Mute" alt="Mute">
		<img src="link.png" class="ctrlImg" id="brainaural-link" title="Tweak at Brainaural.com" alt="Tweak at Brainaural.com">
		<div class="balance-section">
			<div class="balance-slider-wrap">
				<input id="tones-music-balance" class="balance-slider" type="range" min="0" max="100" step="1" value="50" aria-label="Tones music balance">
				<div class="balance-labels">
					<span class="balance-label-left">Tones</span>
					<span class="balance-label-right">Music</span>
				</div>
			</div>
		</div>
	</div>

	<div id="wake-lock-status" class="wake-lock-status" style="display: none;">
		<span id="wake-lock-icon">On</span>
		<span id="wake-lock-text">Screen will stay on</span>
	</div>

	<div class="preset-youtube-layout">
		<div class="preset-grid">
			<div id="preset-buttons-container"></div>
		</div>

		<div class="youtube-section youtube-mode-player">
			<div class="youtube-controls">
				<button id="save-playlist-btn" class="save-button" type="button">Add Playlist</button>
				<input type="text" id="playlist-url" class="playlist-input" placeholder="Enter YouTube playlist URL" value="https://www.youtube.com/playlist?list=PLr6Fn9qwKreJh28Ac9DexzsRY_tq6-KHF">
			</div>
			<div id="recent-playlists" class="recent-playlists-container" style="display: none;"></div>
			<div class="youtube-display-bar">
				<button id="youtube-display-toggle" class="youtube-display-toggle" type="button" aria-controls="youtube-player" aria-expanded="true">Show controls</button>
			</div>
			<div id="youtube-simple-controls" class="youtube-simple-controls" aria-label="YouTube playback controls">
				<div class="youtube-now-playing" aria-live="polite">
					<div id="youtube-track-title" class="youtube-track-title">YouTube playlist</div>
					<div class="youtube-track-meta">
						<span id="youtube-track-author"></span>
						<span id="youtube-track-index"></span>
						<span id="youtube-track-time">0:00</span>
					</div>
				</div>
				<div class="youtube-transport-controls">
					<button id="youtube-previous-btn" class="youtube-transport-button" type="button" aria-label="Previous YouTube track" title="Previous YouTube track">
						<span aria-hidden="true">&#9664;&#9664;</span>
					</button>
					<button id="youtube-playpause-btn" class="youtube-transport-button youtube-playpause-button" type="button" aria-label="Play YouTube" title="Play YouTube">
						<span aria-hidden="true">&#9654;</span>
					</button>
					<button id="youtube-next-btn" class="youtube-transport-button" type="button" aria-label="Next YouTube track" title="Next YouTube track">
						<span aria-hidden="true">&#9654;&#9654;</span>
					</button>
				</div>
			</div>
			<div class="youtube-player-container">
				<div id="youtube-player"></div>
			</div>
		</div>
	</div>

	<div id="radioTouch"></div>
</main>

<script src="mousetrap.min.js"></script>
<script src="preset_data.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/tone-engine.js"></script>
<script src="js/youtube-controller.js"></script>
<script async src="https://www.youtube.com/iframe_api"></script>
<script src="js/playback-session.js"></script>
<script src="js/media-session.js"></script>
<script src="js/ui.js"></script>
<script src="js/acceptance-api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
