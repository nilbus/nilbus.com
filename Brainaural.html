var TABS=5;

		else context = new webkitAudioContext();

	noiseL[t].buffer=noiseBuffer;
	noiseL[t].loop=true;
	noiseR[t]=context.createBufferSource();
	noiseR[t].buffer=noiseBuffer;
	noiseR[t].loop=true;

	filterL[t] = context.createBiquadFilter();
	filterR[t].type = "bandpass";
	filterR[t].frequency.value = CARRIER[t];
	filterR[t].Q.value = 2;

	filterL[t].frequency.value = CARRIER[t];

	lfoGain[t].gain.value=ISOCHRONIC[t]/100*gainI[t].gain.value;

	oscGainL[t].connect(gainL[t]);
	oscGainR[t].connect(gainR[t]);
	filterL[t].connect(gainL[t]);
	filterR[t].connect(gainR[t]);

	merger[t]=context.createChannelMerger(2);
	merger[t].connect(gainI[t]);

	gainL[t].connect(merger[t],0,0);
	gainR[t].connect(merger[t],0,1);

	gainGlobal[t]=context.createGain();
	gainGlobal[t].gain.value=LEVEL[t]/100;
	gainI[t].connect(gainGlobal[t]);
	gainGlobal[t].connect(context.destination);

	// everything is ready and connected, start!
	lfo[t].start();
	lfoHalf[t].start();
	oscL[t].start();
	oscR[t].start();
	noiseR[t].start(0,3);
	noiseL[t].start();
	}

	// Check if context was suspended after creation
	setTimeout(function() {webAudioContextCheck();}, 100);

	// Set up Media Session API
	setupMediaSession();

	// Set initial state - context starts suspended, so we're paused
	bPaused = true;
	$("#mute").addClass("superactive");
	updateMediaSessionState('paused');
}


function init() {

	// Startup checks

	// Supports WebAudio?
	if(typeof webkitAudioContext !== "undefined") bWEBAUDIO=1;
	if(typeof AudioContext !== "undefined") bWEBAUDIO=1;

	if (bWEBAUDIO) {
		// Don't create audio context immediately - wait for user interaction
		// Audio context will be created lazily in initializeAudio()
	}
	else alert('Web Audio API is missing. To enjoy Brainaural, please use a recent version of Chrome, Edge, Safari or Firefox (basically everything but Internet Explorer).');

}

function selectPreset(preset, outputType) {
	// Initialize audio context on first user interaction
	if (!bAUDIO_INITIALIZED) {
		initializeAudio();
		// Continue with preset application after audio is initialized
		applyPresetLogic(preset, outputType);
		return;
	}

	// Check if context is suspended and resume if needed (handles iOS autoplay prevention)
	if (bSUSPENDED && context.state === "suspended") {
		context.resume().then(() => {
			bSUSPENDED = 0;
			// Continue with preset application after context is resumed
			applyPresetLogic(preset, outputType);
		}).catch((error) => {
			console.error('Failed to resume audio context:', error);
			// Still try to apply preset even if resume fails
			applyPresetLogic(preset, outputType);
		});
	} else {
		// Normal preset application
		applyPresetLogic(preset, outputType);
	}
}

function applyPresetLogic(preset, outputType) {
	// Store current selection
	currentPreset = preset;
	currentOutputType = outputType;

	// Apply preset parameters
	applyPreset(preset, outputType);

	// Update preset display and metadata
	updateActivePresetDisplay();

	// Auto-play when preset is selected - ensure context is resumed and playing
	ensureAudioPlaying();

	// Show message
	msg(`Applied ${preset.name} for ${outputType}`);
}

function applyPreset(preset, outputType) {
	// Clear all generators first
	for (let i = 0; i < TABS; i++) {
		setSliders(0, 220, 0, 0, 0, 0, 0, i);
		setLevel(0, i);
	}

	// Generate parameters for the selected output type
	const params = generatePresetParams(preset, outputType);

	// Apply parameters to generators
	preset.layers.forEach((layer, i) => {
		if (i >= TABS) return; // Don't exceed available generators

		const mod = params[`mod${i}`] || 0;
		const car = params[`car${i}`] || 220;
		const noi = params[`noi${i}`] || 0;
		const iso = params[`iso${i}`] || 0;
		const bin = params[`bin${i}`] || 0;
		const bil = params[`bil${i}`] || 0;
		const fm = params[`fm${i}`] || 0;
		const lvl = params[`lvl${i}`] || 0;

		setSliders(mod, car, noi, iso, bin, bil, fm, i);
		setLevel(lvl, i);
	});
}

function setSingleCarrier(val,t,bNoMsg){
	CARRIER[t]=val;
	oscL[t].frequency.value=CARRIER[t]-MOD[t]/2*BINAURAL[t]/100;
	oscR[t].frequency.value=CARRIER[t]+MOD[t]/2*BINAURAL[t]/100;
	filterL[t].frequency.value=CARRIER[t];
	filterR[t].frequency.value=CARRIER[t];

	fmGain[t].gain.value=FM[t]/100*CARRIER[t];
	filterGain[t].gain.value=FM[t]/150*CARRIER[t];
	var fmax=Math.pow(2,OCTCAR)*FCARMIN;
	gainI[t].gain.value=0.5*(1-0.5*CARRIER[t]/fmax)*(1-0.6*CARRIER[t]/fmax);
	$("#carval").val(parseInt(val)+'Hz');
	if (!bNoMsg){
		if (val>1000) msg("A high as you can hear!");
		else msg("Make it low, but still audible");
	}
}

function setSingleMod(val,t,bNoMsg){
var cT=context.currentTime;
	MOD[t]=val;
	oscL[t].frequency.value=CARRIER[t]+val/2*BINAURAL[t]/100;
	oscR[t].frequency.value=CARRIER[t]-val/2*BINAURAL[t]/100;
	lfo[t].frequency.setTargetAtTime(val,cT,0.001); // Safari bug, next line didn't work
	//lfo[t].frequency.value=val;
	lfoHalf[t].frequency.setTargetAtTime(val/2,cT,0.001); // Safari bug, next line didn't work
	//lfoHalf[t].frequency.value=val/2;
	$("#modval").val(parseInt(val*100)/100+'Hz');
	var text;
	if (val<0.5)text="Ultra-Low Delta";
	if (val>0.5)text="Delta";
	if (val>4)text="Theta";
	if (val>8)text="Alpha";
	if (val>12)text="Beta";
	if (val>30)text="Gamma";
	if (val>60)text="High Gamma";
	if (!bNoMsg) msg(text);
}

function performPlayAction(){
	if (bPaused) {
		bPaused = false;
		// Play: resume the audio context
		if (context) {
			context.resume().then(() => {
			$("#mute").removeClass("superactive");

			// Play the anchor audio element to maintain Media Session
			if (mediaSessionAnchor) {
				mediaSessionAnchor.play().catch(e => console.log('Anchor play error:', e));
			}

			// Play YouTube player if ready
			if (player && isPlayerReady) {
				player.playVideo();
			}

			// Update preset display and metadata when resuming
			updateActivePresetDisplay();
			updateMediaSessionState('playing');
			msg("Audio playing");
		}).catch((error) => {
			console.error('Failed to resume audio context:', error);
		});
		} else {
			// Context not initialized yet, just update UI state
			$("#mute").removeClass("superactive");

			// Play YouTube player if ready
			if (player && isPlayerReady) {
				player.playVideo();
			}

			// Update preset display and metadata when resuming
			updateActivePresetDisplay();
			updateMediaSessionState('playing');
			msg("Audio playing");
		}
	}
}

function performPauseAction(){
	if (!bPaused) {
		bPaused = true;
		// Pause: suspend the audio context
		if (context) {
			context.suspend().then(() => {
			$("#mute").addClass("superactive");
			// Remove active class from all preset buttons
			document.querySelectorAll('.preset-button').forEach(btn => {
				btn.classList.remove('active');
			});

			// Pause the anchor audio element
			if (mediaSessionAnchor) {
				mediaSessionAnchor.pause();
			}

			// Pause YouTube player if ready
			if (player && isPlayerReady) {
				player.pauseVideo();
				// Save YouTube state when pausing
				saveYouTubeState();
			}

			updateMediaSessionState('paused');
			msg("Audio paused");
		}).catch((error) => {
			console.error('Failed to suspend audio context:', error);
		});
		} else {
			// Context not initialized yet, just update UI state
			$("#mute").addClass("superactive");
			// Remove active class from all preset buttons
			document.querySelectorAll('.preset-button').forEach(btn => {
				btn.classList.remove('active');
			});

			// Pause the anchor audio element
			if (mediaSessionAnchor) {
				mediaSessionAnchor.pause();
			}

			// Pause YouTube player if ready
			if (player && isPlayerReady) {
				player.pauseVideo();
				// Save YouTube state when pausing
				saveYouTubeState();
			}

			updateMediaSessionState('paused');
			msg("Audio paused");
		}
	} else {
		console.log('Already paused, no action needed');
	}
}

function setupMediaSession() {
	// Check if Media Session API is supported
	if (!('mediaSession' in navigator)) {
		console.log('Media Session API not supported');
		return;
	}

	// Create a silent audio element to anchor the Media Session
	// This is a workaround for browsers that don't properly support Media Session with Web Audio API alone
	if (!mediaSessionAnchor) {
		mediaSessionAnchor = new Audio();
		// Create a very short silent audio data URL
		mediaSessionAnchor.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
		mediaSessionAnchor.loop = true;
		mediaSessionAnchor.volume = 0; // Silent
		mediaSessionAnchor.preload = 'auto';

	}

	// Set initial media metadata
	updateMediaSessionMetadata();

	// Set up action handlers
	navigator.mediaSession.setActionHandler('play', () => {
		if (bPaused) {
			performPlayAction();
		}
	});

	navigator.mediaSession.setActionHandler('pause', () => {
		if (!bPaused) {
			performPauseAction();
		}
	});

	navigator.mediaSession.setActionHandler('stop', () => {
		if (!bPaused) {
			performPauseAction();
		}
	});

	// Set initial playback state based on current audio state
	const initialState = bPaused ? 'paused' : 'playing';
	navigator.mediaSession.playbackState = initialState;

	// Try to activate the media session
	try {
		// This might help with some browsers
		if (navigator.mediaSession.setPositionState) {
			navigator.mediaSession.setPositionState({
				duration: Infinity, // Live/continuous audio
				playbackRate: 1.0,
				position: 0
			});
		}
	} catch (e) {
		console.log('Position state not supported:', e);
	}
}

function updateMediaSessionState(state) {
	if (!('mediaSession' in navigator)) return;
	navigator.mediaSession.playbackState = state;
}

function ensureAudioPlaying() {
	// If context is suspended, resume it
	if (context && context.state === "suspended") {
		context.resume().then(() => {
			bSUSPENDED = 0;
			performPlayAction();
		}).catch((error) => {
			console.error('Failed to resume audio context:', error);
		});
	} else if (bPaused) {
		// If context is running but we're in paused state, play
		performPlayAction();
	}
}

// Unified play/pause handler that works the same as OS media events
function handlePlayPauseClick() {
	// Initialize audio context on first user interaction
	if (!bAUDIO_INITIALIZED) {
		initializeAudio();
		// Continue with play/pause toggle after audio is initialized
		performUnifiedPlayPauseToggle();
		return;
	}

	// Check if context is suspended and resume if needed (handles iOS autoplay prevention)
	if (bSUSPENDED && context.state === "suspended") {
		context.resume().then(() => {
			bSUSPENDED = 0;
			// Continue with play/pause toggle after context is resumed
			performUnifiedPlayPauseToggle();
		}).catch((error) => {
			console.error('Failed to resume audio context:', error);
			// Still try to toggle play/pause even if resume fails
			performUnifiedPlayPauseToggle();
		});
	} else {
		// Normal play/pause toggle
		performUnifiedPlayPauseToggle();
	}
}

function performUnifiedPlayPauseToggle() {
	// Use the same logic as Media Session API handlers
	if (bPaused) {
		performPlayAction();
	} else {
		performPauseAction();
	}
}

// Keypresses - use the same unified handler as the mute button
Mousetrap.bind('m', function() { handlePlayPauseClick(); });
Mousetrap.bind('space', function() { handlePlayPauseClick(); });

function onPlayerReady(event) {
	isPlayerReady = true;

	// Try to restore saved playback state
	var savedState = loadYouTubeState();
	if (savedState) {

		// Get the current playlist ID from the URL input field
		var playlistInput = document.getElementById('playlist-url');
		var currentPlaylistId = null;
		if (playlistInput && playlistInput.value) {
			currentPlaylistId = extractPlaylistId(playlistInput.value);
		}

		// Use the current playlist ID if available, otherwise use the saved one
		var playlistToLoad = currentPlaylistId || savedState.playlistId;

		if (playlistToLoad) {
			// Restore the saved track and playback position without autoplay
			// First load the playlist without startSeconds to prevent autoplay
			player.loadPlaylist({
				'listType': 'playlist',
				'list': playlistToLoad,
				'index': savedState.videoIndex
			});

			// After playlist loads, seek to the saved position without playing
			setTimeout(function() {
				if (player && isPlayerReady) {
					// Seek to the saved time without playing
					player.seekTo(savedState.playbackTime, true);
					// Ensure it's paused
					player.pauseVideo();
				}
			}, 500);
		} else {
			clearYouTubeState();
		}
	}
}

function onPlayerStateChange(event) {
	// Sync brainaural tones with YouTube player state
	if (event.data == YT.PlayerState.PLAYING) {
		// YouTube started playing - ensure brainaural tones are also playing
		if (bPaused) {
			performPlayAction();
		}
	} else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
		// YouTube paused/ended - pause brainaural tones
		if (!bPaused) {
			performPauseAction();
		}
	}

	// Handle track changes and state clearing
	if (event.data == YT.PlayerState.ENDED) {
		// Video ended - clear saved state to start fresh next time
		clearYouTubeState();
	} else if (event.data == YT.PlayerState.PLAYING) {
		// Check if we've changed tracks manually (not from restoration)
		var currentIndex = player.getPlaylistIndex();
		var savedIndex = localStorage.getItem('youtube_playlist_index');
		if (savedIndex !== null && parseInt(savedIndex) !== currentIndex) {
			// User manually changed tracks, clear saved time to prevent wrong position
			localStorage.removeItem('youtube_playback_time');
		}
	}
}

function extractPlaylistId(url) {
	// Extract playlist ID from both YouTube and YouTube Music URLs
	var match = url.match(/[?&]list=([^&]+)/);
	return match ? match[1] : null;
}

function loadPlaylist() {
	var url = document.getElementById('playlist-url').value;
	var playlistId = extractPlaylistId(url);
	var input = document.getElementById('playlist-url');

	if (playlistId && player && isPlayerReady) {
		player.loadPlaylist({
			'listType': 'playlist',
			'list': playlistId
		});
		input.classList.remove('invalid');
		console.log('Loaded playlist:', playlistId);
	} else if (!playlistId) {
		input.classList.add('invalid');
		console.log('Invalid playlist URL');
	} else {
		console.log('Player not ready yet');
	}
}

});

});

// YouTube Playback Persistence Functions
function saveYouTubeState() {
	if (!player || !isPlayerReady) {
		return;
	}

	try {
		var videoIndex = player.getPlaylistIndex();
		var playbackTime = player.getCurrentTime();

		// Get playlist ID from the URL input field instead of player
		var playlistInput = document.getElementById('playlist-url');
		var playlistId = '';
		if (playlistInput && playlistInput.value) {
			playlistId = extractPlaylistId(playlistInput.value) || '';
		}

		// Only save if we have valid data
		if (videoIndex !== undefined && videoIndex >= 0 && playbackTime !== undefined) {
			localStorage.setItem('youtube_playlist_index', videoIndex.toString());
			localStorage.setItem('youtube_playback_time', playbackTime.toString());
			localStorage.setItem('youtube_playlist_id', playlistId);
		}
	} catch (error) {
		console.error('Error saving YouTube state:', error);
	}
}

function loadYouTubeState() {
	try {
		var savedIndex = localStorage.getItem('youtube_playlist_index');
		var savedTime = localStorage.getItem('youtube_playback_time');
		var savedPlaylistId = localStorage.getItem('youtube_playlist_id');

		if (savedIndex !== null && savedTime !== null) {
			var videoIndex = parseInt(savedIndex);
			var playbackTime = parseFloat(savedTime);

			// Validate the saved data
			if (!isNaN(videoIndex) && !isNaN(playbackTime) && videoIndex >= 0 && playbackTime >= 0) {
				return {
					videoIndex: videoIndex,
					playbackTime: playbackTime,
					playlistId: savedPlaylistId
				};
			}
		}
	} catch (error) {
		console.error('Error loading YouTube state:', error);
	}

	return null;
}

function clearYouTubeState() {
	try {
		localStorage.removeItem('youtube_playlist_index');
		localStorage.removeItem('youtube_playback_time');
		localStorage.removeItem('youtube_playlist_id');
	} catch (error) {
		console.error('Error clearing YouTube state:', error);
	}
}
